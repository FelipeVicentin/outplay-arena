<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Outplay Arena - Esportes de Areia</title>
  
  <!-- Fonte Oficial Sora -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&display=swap" rel="stylesheet">

  <!-- FontAwesome Ícones -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Estilos CSS com versão v3.0 para limpar cache -->
  <link rel="stylesheet" href="./style.css?v=3.0">
</head>
<body>

  <!-- CABEÇALHO COM DESIGN UNIFORME -->
  <header class="header">
    <div class="logo-container">
      <img src="./img/logo.png" alt="Outplay Arena - Esportes de Areia" class="logo-img" onerror="this.style.display='none'; document.getElementById('fallback-logo').style.display='block';">
      <div id="fallback-logo" class="logo-fallback">OUTPLAY ARENA</div>
    </div>
    <!-- Botão de Acesso à Área Restrita -->
    <button class="btn-admin-access" onclick="openAdminModal()" title="Acesso Restrito ao Dono">
      <i class="fa-solid fa-lock"></i>
      <span class="btn-admin-text">Área Restrita</span>
      <span id="badge-pending-count" class="badge-count" style="display: none;">0</span>
    </button>
  </header>

  <!-- SUBTÍTULO -->
  <div class="hero">
    <p class="subtitle">Agendamento Online de Horários • Esportes de Areia</p>
  </div>

  <!-- CONTAINER PRINCIPAL -->
  <main class="main-container">
    <div class="card">
      
      <!-- INDICADOR DE PASSO A PASSO ORGANIZADO -->
      <div class="steps">
        <div class="step-item active" id="step1-indicator">
          <div class="step-number">1</div>
          <div class="step-label">Modalidade</div>
        </div>
        <div class="step-item" id="step2-indicator">
          <div class="step-number">2</div>
          <div class="step-label">Data/Hora</div>
        </div>
        <div class="step-item" id="step3-indicator">
          <div class="step-number">3</div>
          <div class="step-label">Pagamento</div>
        </div>
        <div class="step-item" id="step4-indicator">
          <div class="step-number">4</div>
          <div class="step-label">Confirmação</div>
        </div>
      </div>

      <!-- ETAPA 1: SELEÇÃO DA MODALIDADE -->
      <div id="step1" class="step-content">
        <h2 class="step-title">Selecione o Esporte</h2>
        
        <div class="sports-grid">
          <!-- Futevôlei -->
          <div class="sport-card selected" onclick="selectSport('Futevôlei', this)">
            <div class="sport-img-wrapper">
              <img src="./img/FV.png" alt="Futevôlei" class="sport-img" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
              <i class="fa-solid fa-volleyball sport-icon-fallback" style="display:none;"></i>
            </div>
            <h3>Futevôlei</h3>
          </div>

          <!-- Beach Tennis -->
          <div class="sport-card" onclick="selectSport('Beach Tennis', this)">
            <div class="sport-img-wrapper">
