<!-- LÓGICA INTEGRAÇÃO FIREBASE EM TEMPO REAL -->
  <script>
    // ⚙️ Suas Chaves Oficiais do Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyAZn0OrfAmdJWvRf6EK2CbkFLehDkS7S9A",
      authDomain: "outplay-arena.firebaseapp.com",
      databaseURL: "https://outplay-arena-default-rtdb.firebaseio.com",
      projectId: "outplay-arena",
      storageBucket: "outplay-arena.firebasestorage.app",
      messagingSenderId: "643232920665",
      appId: "1:643232920665:web:7d9bec459ddcda0c1aad48",
      measurementId: "G-MTWDLZM52H"
    };

    // Inicializa o Firebase e o Banco de Dados
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let selectedSport = 'Futevôlei';
    let selectedTime = '';
    let selectedPrice = '';
    let bookedSlots = {};

    document.getElementById('booking-date').valueAsDate = new Date();
    document.getElementById('admin-view-date').valueAsDate = new Date();

    // ESCUTA ALTERAÇÕES EM TEMPO REAL NA NUVEM DE QUALQUER DISPOSITIVO!
    db.ref('outplay_booked_slots').on('value', (snapshot) => {
      bookedSlots = snapshot.val() || {};
      renderTimes();
      updatePendingBadge();
      renderAdminCalendar();
      renderPendingRequests();
    });

    function updatePendingBadge() {
      let pendingCount = 0;
      for (let date in bookedSlots) {
        if (Array.isArray(bookedSlots[date])) {
          bookedSlots[date].forEach(booking => {
            if (booking && booking.status === 'pending') pendingCount++;
          });
        }
      }

      const badge = document.getElementById('badge-pending-count');
      if (pendingCount > 0) {
        badge.innerText = pendingCount;
        badge.style.display = 'inline-flex';
      } else {
        badge.style.display = 'none';
      }
    }

    function selectSport(sport, element) {
      selectedSport = sport;
      document.querySelectorAll('.sport-card').forEach(card => card.classList.remove('selected'));
      element.classList.add('selected');
      renderTimes();
    }

    function renderTimes() {
      const grid = document.getElementById('time-grid');
      const selectedDate = document.getElementById('booking-date').value;
      grid.innerHTML = '';
      selectedTime = '';
      selectedPrice = '';

      const times = [
        { time: '16:00 - 17:00', price: 'R$ 60,00' },
        { time: '17:00 - 18:00', price: 'R$ 60,00' },
        { time: '18:00 - 19:00', price: 'R$ 60,00' },
        { time: '19:00 - 20:00', price: 'R$ 60,00' },
        { time: '20:00 - 21:00', price: 'R$ 60,00' },
        { time: '21:00 - 22:00', price: 'R$ 60,00' }
      ];

      const currentBookings = bookedSlots[selectedDate] || [];
      let firstAvailableFound = false;

      times.forEach((item) => {
        const bookingData = currentBookings.find(b => b && b.time === item.time);
        const isBooked = !!bookingData;
        const div = document.createElement('div');
        
        div.className = 'time-slot' + (isBooked ? ' disabled' : '');
        
        if (isBooked) {
          const statusText = bookingData.status === 'confirmed' ? 'Ocupado' : 'Aguardando PIX';
          div.innerHTML = `
            <div class="time-text">${item.time}</div>
            <div class="time-price status-booked">${statusText} (${bookingData.sport})</div>
          `;
        } else {
          if (!firstAvailableFound) {
            div.classList.add('selected');
            selectedTime = item.time;
            selectedPrice = item.price;
            firstAvailableFound = true;
          }

          div.innerHTML = `
            <div class="time-text">${item.time}</div>
            <div class="time-price">${item.price}</div>
          `;

          div.onclick = () => {
            document.querySelectorAll('.time-slot').forEach(slot => slot.classList.remove('selected'));
            div.classList.add('selected');
            selectedTime = item.time;
            selectedPrice = item.price;
          };
        }

        grid.appendChild(div);
      });

      if (!firstAvailableFound && times.length > 0) {
        grid.innerHTML += `<p class="no-slots-msg">Todos os horários da quadra nesta data já estão ocupados.</p>`;
      }
    }

    function goToStep(step) {
      document.querySelectorAll('.step-content').forEach(el => el.style.display = 'none');
      document.getElementById(`step${step}`).style.display = 'block';

      for (let i = 1; i <= 4; i++) {
        document.getElementById(`step${i}-indicator`).classList.toggle('active', i <= step);
      }
    }

    function validateStep2AndProceed() {
      if (!selectedTime) {
        alert('Por favor, selecione um horário disponível para continuar.');
        return;
      }
      goToStep(3);
    }

    function validateAndGoToStep4() {
      const name = document.getElementById('user-name').value.trim();
      const phone = document.getElementById('user-phone').value.trim();

      if (!name || !phone) {
        alert('Por favor, preencha o seu Nome Completo e o WhatsApp.');
        return;
      }

      const rawDate = document.getElementById('booking-date').value;
      if (!bookedSlots[rawDate]) {
        bookedSlots[rawDate] = [];
      }
      
      const existing = bookedSlots[rawDate].find(b => b && b.time === selectedTime);
      if (!existing) {
        bookedSlots[rawDate].push({
          time: selectedTime,
          sport: selectedSport,
          name: name,
          phone: phone,
          price: selectedPrice,
          status: 'pending'
        });
        
        // SALVA NA NUVEM NO FIREBASE (SINCRONIZA TODOS OS APARELHOS)
        db.ref('outplay_booked_slots').set(bookedSlots);
      }

      goToStep(4);
    }

    function copyPixKey() {
      const pixKey = document.getElementById('pix-key').innerText;
      navigator.clipboard.writeText(pixKey);
      alert('Chave PIX copiada para a área de transferência!');
    }

    function sendToWhatsApp() {
      const name = document.getElementById('user-name').value;
      const phone = document.getElementById('user-phone').value;
      const rawDate = document.getElementById('booking-date').value;
      const dateFormatted = rawDate ? rawDate.split('-').reverse().join('/') : 'Data não informada';

      const message = `🎾 *NOVO AGENDAMENTO - OUTPLAY ARENA*\n\n` +
                      `👤 *Nome:* ${name}\n` +
                      `📱 *WhatsApp:* ${phone}\n` +
                      `⚽ *Esporte:* ${selectedSport}\n` +
                      `📅 *Data:* ${dateFormatted}\n` +
                      `⏰ *Horário:* ${selectedTime}\n` +
                      `💰 *Valor:* ${selectedPrice}\n\n` +
                      `📌 *Segue o comprovante do PIX em anexo:*`;

      window.open(`https://wa.me/5542999109395?text=${encodeURIComponent(message)}`, '_blank');
    }

    function openAdminModal() {
      document.getElementById('admin-modal').style.display = 'flex';
      document.getElementById('admin-login-view').style.display = 'block';
      document.getElementById('admin-dashboard-view').style.display = 'none';
      document.getElementById('admin-pass-input').value = '';
    }

    function closeAdminModal() {
      document.getElementById('admin-modal').style.display = 'none';
    }

    function checkAdminPassword() {
      const pass = document.getElementById('admin-pass-input').value;
      if (pass === '1234') {
        document.getElementById('admin-login-view').style.display = 'none';
        document.getElementById('admin-dashboard-view').style.display = 'block';
        loadAdminDashboard();
      } else {
        alert('Senha incorreta!');
      }
    }

    function loadAdminDashboard() {
      renderPendingRequests();
      renderAdminCalendar();
    }

    function renderPendingRequests() {
      const container = document.getElementById('pending-requests-container');
      if (!container) return;
      container.innerHTML = '';

      let count = 0;

      for (let date in bookedSlots) {
        const dateFormatted = date ? date.split('-').reverse().join('/') : date;

        if (Array.isArray(bookedSlots[date])) {
          bookedSlots[date].forEach((booking, index) => {
            if (booking && booking.status === 'pending') {
              count++;
              const item = document.createElement('div');
              item.className = 'pending-card';
              item.innerHTML = `
                <div class="pending-info">
                  <strong>👤 ${booking.name}</strong> (${booking.phone})<br>
                  <span>📅 ${dateFormatted} • ⏰ ${booking.time} • ⚽ ${booking.sport}</span>
                </div>
                <div class="pending-actions">
                  <button class="btn-approve" onclick="approveBooking('${date}', ${index})">
                    <i class="fa-solid fa-check"></i> Aprovar PIX
                  </button>
                  <button class="btn-reject" onclick="rejectBooking('${date}', ${index})">
                    <i class="fa-solid fa-xmark"></i> Recusar
                  </button>
                </div>
              `;
              container.appendChild(item);
            }
          });
        }
      }

      if (count === 0) {
        container.innerHTML = `<p class="no-pending-msg"><i class="fa-solid fa-circle-check"></i> Nenhuma confirmação de PIX pendente no momento.</p>`;
      }
    }

    function approveBooking(date, index) {
      bookedSlots[date][index].status = 'confirmed';
      db.ref('outplay_booked_slots').set(bookedSlots);
    }

    function rejectBooking(date, index) {
      if (confirm('Deseja recusar e liberar este horário para outros clientes?')) {
        bookedSlots[date].splice(index, 1);
        if (bookedSlots[date].length === 0) delete bookedSlots[date];
        db.ref('outplay_booked_slots').set(bookedSlots);
      }
    }

    function renderAdminCalendar() {
      const grid = document.getElementById('admin-calendar-grid');
      if (!grid) return;
      const date = document.getElementById('admin-view-date').value;
      grid.innerHTML = '';

      const times = ['16:00 - 17:00', '17:00 - 18:00', '18:00 - 19:00', '19:00 - 20:00', '20:00 - 21:00', '21:00 - 22:00'];
      const currentBookings = bookedSlots[date] || [];

      times.forEach(time => {
        const bookingIndex = currentBookings.findIndex(b => b && b.time === time);
        const booking = bookingIndex !== -1 ? currentBookings[bookingIndex] : null;

        const card = document.createElement('div');
        card.className = 'admin-time-card ' + (booking ? (booking.status === 'confirmed' ? 'confirmed' : 'pending') : 'available');

        if (booking) {
          card.innerHTML = `
            <div class="time-header">
              <strong>⏰ ${time}</strong>
              <span class="status-tag ${booking.status}">${booking.status === 'confirmed' ? 'Confirmado' : 'Aguardando PIX'}</span>
            </div>
            <div class="client-detail">
              ⚽ <strong>${booking.sport}</strong><br>
              👤 ${booking.name}<br>📱 ${booking.phone}
            </div>
            <button class="btn-cancel-sm" onclick="rejectBooking('${date}', ${bookingIndex})">
              <i class="fa-solid fa-trash"></i> Liberar Horário
            </button>
          `;
        } else {
          card.innerHTML = `
            <div class="time-header">
              <strong>⏰ ${time}</strong>
              <span class="status-tag available">Livre</span>
            </div>
            <button class="btn-block-sm" onclick="blockSlotManually('${date}', '${time}')">
              <i class="fa-solid fa-ban"></i> Bloquear Vaga
            </button>
          `;
        }

        grid.appendChild(card);
      });
    }

    function blockSlotManually(date, time) {
      if (!bookedSlots[date]) bookedSlots[date] = [];
      bookedSlots[date].push({
        time: time,
        sport: 'Bloqueio Presencial',
        name: 'Bloqueado (Dono)',
        phone: 'Arena',
        price: 'R$ 60,00',
        status: 'confirmed'
      });
      db.ref('outplay_booked_slots').set(bookedSlots);
    }
  </script>
